name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: EAS iOS production build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate iOS bundle
        run: npx expo export --platform ios --output-dir .expo-export-ci

      - name: Check EAS credentials
        id: eas_credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=EXPO_TOKEN missing::The app is validated, but GitHub cannot create the IPA until EXPO_TOKEN is added in Settings > Secrets and variables > Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build IPA with EAS
        if: steps.eas_credentials.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive

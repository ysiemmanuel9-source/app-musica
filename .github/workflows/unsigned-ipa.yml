name: Build Unsigned IPA for eSign

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Smoke test release app launch on iOS Simulator
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          SCHEME="Emmanuel"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build

          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e 'data = JSON.parse(STDIN.read); dev = data["devices"].values.flatten.find { |d| d["name"].include?("iPhone") && d["isAvailable"] }; puts dev["udid"]')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          APP_PATH="$(find build/sim/Build/Products/Release-iphonesimulator -name '*.app' -type d | head -n 1)"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.emmanuel.music
          sleep 12

          xcrun simctl io "$DEVICE_ID" screenshot emmanuel-smoke.png || true

          if ! xcrun simctl spawn "$DEVICE_ID" ps -A -o pid,comm,args | grep -q "[E]mmanuel"; then
            echo "Emmanuel was not running 12 seconds after launch"
            xcrun simctl spawn "$DEVICE_ID" log show --last 3m --predicate 'process == "Emmanuel" OR eventMessage CONTAINS "com.emmanuel.music" OR eventMessage CONTAINS "Emmanuel"' || true
            exit 1
          fi

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmanuel-ios-smoke-screenshot
          path: emmanuel-smoke.png
          if-no-files-found: ignore

      - name: Build unsigned app
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          SCHEME="Emmanuel"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/ios/Build/Products/Release-iphoneos -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app was produced"
            exit 1
          fi
          rm -rf Payload Emmanuel-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Emmanuel-unsigned.ipa Payload
          ls -lh Emmanuel-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Emmanuel-unsigned-ipa-for-eSign
          path: Emmanuel-unsigned.ipa
          if-no-files-found: error
